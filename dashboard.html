<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン｜M.T DICE</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937}
.box{width:min(430px,92vw);background:#fff;border:1px solid #dbe2ea;border-radius:18px;padding:30px;box-shadow:0 14px 38px rgba(15,23,42,.14)}
h1{font-size:23px;margin:0 0 8px}.sub{color:#6b7280;font-size:13px;margin-bottom:22px}
label{font-size:12px;color:#6b7280;font-weight:700;display:block;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #dbe2ea;border-radius:10px;font:inherit}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;font:inherit}
.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.demo{margin-top:15px;color:#6b7280;font-size:12px;line-height:1.6;background:#f8fafc;padding:12px;border-radius:10px}
</style>
</head>
<body><div class="box">
<h1>M.T DICE Processing Manager</h1><div class="sub">ジュエリー加工管理システム 実用版</div>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post"><label>ユーザー名</label><input name="username" value="admin"><label>パスワード</label><input name="password" type="password" value="demo1234"><button>ログイン</button></form>
<div class="demo">デモID：admin<br>デモPW：demo1234</div>
</div></body></html>
