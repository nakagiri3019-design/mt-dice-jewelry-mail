<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>メール履歴編集</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f4f6f9;color:#1f2937;margin:0}
.wrap{max-width:900px;margin:28px auto;background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
h1{margin:0 0 18px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label{font-size:12px;color:#6b7280;font-weight:700;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #dbe2ea;border-radius:9px;font:inherit}
.full{grid-column:1/-1}.actions{margin-top:18px;display:flex;gap:10px}
button,a{padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:700}
button{border:0;background:#2563eb;color:#fff}a{border:1px solid #dbe2ea;color:#1f2937;background:#fff}
</style></head><body><div class="wrap">
<h1>メール履歴編集</h1>
<form method="post" class="grid">
<div><label>日時</label><input name="date" value="{{message.date}}"></div>
<div><label>取引先</label><input name="client" value="{{message.client}}"></div>
<div><label>関連管理番号</label><input name="related_code" value="{{message.related_code}}"></div>
<div><label>分類</label><select name="kind">{% for k in ["受注確認","納期確認","納品確認","請求確認","その他"] %}<option {% if message.kind==k %}selected{% endif %}>{{k}}</option>{% endfor %}</select></div>
<div class="full"><label>件名</label><input name="subject" value="{{message.subject}}"></div>
<div><label>担当者</label><input name="person" value="{{message.person}}"></div>
<div><label>添付資料名</label><input name="attachment_name" value="{{message.attachment_name}}"></div>
<div class="full"><label>本文・内容メモ</label><textarea name="body" rows="8">{{message.body}}</textarea></div>
<div class="actions full"><button>保存</button><a href="/message/{{message.id}}">戻る</a></div>
</form></div></body></html>
