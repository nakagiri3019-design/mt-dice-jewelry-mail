<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン</title>
  <style>
    body{margin:0;background:#f3f6fb;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:100%;max-width:420px;background:#fff;border:1px solid #d8dee8;border-radius:18px;padding:28px;box-shadow:0 10px 28px rgba(15,23,42,.08);}
    h1{margin:0 0 8px 0;font-size:26px;}
    .sub{color:#64748b;margin-bottom:22px;}
    label{display:block;font-weight:700;margin:14px 0 7px;}
    input{width:100%;box-sizing:border-box;border:1px solid #cfd7e3;border-radius:11px;padding:12px 13px;font-size:16px;}
    button{width:100%;margin-top:20px;border:none;border-radius:11px;background:#2563eb;color:#fff;padding:13px;font-weight:800;font-size:16px;cursor:pointer;}
    .hint{margin-top:18px;color:#64748b;font-size:13px;line-height:1.6;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>M.T DICE Mail Manager</h1>
      <div class="sub">ジュエリー加工管理・メール管理システム</div>

      <form method="post">
        <label>ユーザーID</label>
        <input name="username" value="admin" autocomplete="username">

        <label>パスワード</label>
        <input name="password" type="password" value="demo1234" autocomplete="current-password">

        <button type="submit">ログイン</button>
      </form>

      <div class="hint">
        テスト用<br>
        ID：admin<br>
        PW：demo1234
      </div>
    </div>
  </div>
</body>
</html>
