<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダッシュボード</title>
  <style>
    body{margin:0;background:#f3f6fb;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
    .layout{display:flex;min-height:100vh;}
    .side{width:245px;background:#1f2937;color:#fff;padding:30px 18px;box-sizing:border-box;}
    .side h2{font-size:20px;margin:0 0 32px 0;line-height:1.4;}
    .side a{display:block;color:#fff;text-decoration:none;padding:12px 14px;border-radius:10px;margin-bottom:8px;font-weight:700;}
    .side a:hover,.side a.active{background:#374151;}
    .main{flex:1;padding:48px 46px;}
    h1{font-size:30px;margin:0 0 28px 0;}
    .card{max-width:980px;background:#fff;border:1px solid #d8dee8;border-radius:16px;padding:22px 24px;box-shadow:0 8px 24px rgba(15,23,42,.06);}
    .buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}
    .btn{display:inline-block;background:#2563eb;color:white;text-decoration:none;border-radius:10px;padding:12px 18px;font-weight:800;}
    .btn.sub{background:#fff;color:#1f2937;border:1px solid #cfd7e3;}
    @media(max-width:760px){
      .layout{display:block;}
      .side{width:auto;padding:18px;}
      .side h2{font-size:18px;margin-bottom:14px;}
      .side a{display:inline-block;margin:4px 4px 4px 0;}
      .main{padding:26px 18px;}
      h1{font-size:24px;}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <h2>M.T DICE<br>Mail Manager</h2>
    <a class="active" href="/dashboard">ダッシュボード</a>
    <a href="/mail">メール</a>
    <a href="/mail/compose">新規作成</a>
  </aside>

  <main class="main">
    <h1>ダッシュボード</h1>
    <div class="card">
      <p>ジュエリー加工管理・メール管理システム</p>
      <div class="buttons">
        <a class="btn" href="/mail">メールを開く</a>
        <a class="btn sub" href="/mail?box=inbox">受信箱</a>
        <a class="btn sub" href="/mail/compose">新規メール作成</a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
